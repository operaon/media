name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown fences
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            count=$(grep -F -o "$(printf '\x60\x60\x60')" "$file" | wc -l || true)
            test $((count % 2)) -eq 0 || { echo "Unbalanced code fence: $file"; exit 1; }
          done < <(find docs -type f -name '*.md' -print0)
      - name: Check for common secret patterns
        run: |
          ! git grep -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- '*.md'
